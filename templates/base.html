<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<!-- Navigacija -->
<nav class="navbar navbar-expand-lg navbar-dark bg-green-brown shadow">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/">Odpadki</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/">Domov</a>
                </li>

           
                <li class="nav-item">
                    <a class="nav-link" href="/tabela">Količina odpadkov v tabeli</a>
                </li>
                                <li class="nav-item">
                    <a class="nav-link" href="/simulacija">Simulacija za prihodnost</a>
                </li>

            </ul>
        </div>
    </div>
</nav>

<!-- Glavni del -->
<div class="container my-4">
    {% block content %}
    {% endblock %}
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
