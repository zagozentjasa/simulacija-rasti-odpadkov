{% extends "base.html" %}
{% block content %}

<h1>Tabela o količini nastalih odpadkov v tonah po občinah</h1>
<p><br></p>
<table border="1">
    <thead>
        <tr>
            {% for col in columns %}
            <th>{{ col }}</th>
            {% endfor %}
        </tr>
    </thead>
    <tbody>
        {% for row in data %}
        <tr>
            {% for col in columns %}
            <td>{{ row[col] }}</td>
            {% endfor %}
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
